<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu cantine Toulouse, maternelle et primaire | La Cantoche rose</title>
  <meta name="description" content="Le menu de la cantine des écoles maternelles et primaires de Toulouse, semaine par semaine : entrée, plat, accompagnement, laitage, dessert et goûter.">
  <link rel="canonical" href="https://fb64.github.io/cantoche-rose/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="La Cantoche rose">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://fb64.github.io/cantoche-rose/">
  <meta property="og:title" content="Menu cantine Toulouse, maternelle et primaire">
  <meta property="og:description" content="Le menu de la cantine des écoles maternelles et primaires de Toulouse, semaine par semaine.">
  <meta property="og:image" content="https://fb64.github.io/cantoche-rose/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="La Cantoche rose, menu de la cantine des écoles de Toulouse">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="google-site-verification" content="kYSA0FlYJOz07JaQE6dF2bwg5PWmwvSJSS_KH2uPS-w">
  <script>
    // Picks the theme before the first paint: the one chosen with the theme button, else the system's.
    {
      let saved = null;
      try {
        saved = localStorage.getItem("cantine.theme");
      } catch {}
      const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : system;
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&family=Playwrite+FR+Moderne&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="menu.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header id="masthead" class="masthead">
    <div class="sheet">
      <div class="school-row">
        <div class="school-row-start">
          <button type="button" id="theme" class="icon-button" aria-label="Thème sombre" title="Thème sombre" aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
            </svg>
          </button>
        </div>
        <fieldset id="school" class="school-toggle">
          <legend class="visually-hidden">Type d’école</legend>
          <label><input type="radio" name="school" value="primaire" checked><span>Primaire</span></label>
          <label><input type="radio" name="school" value="maternelle"><span>Maternelle</span></label>
        </fieldset>
        <a class="icon-button github-link" href="https://github.com/fb64/cantoche-rose" aria-label="Code source sur GitHub" title="Code source sur GitHub">
          <svg class="icon-filled" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        </a>
      </div>
      <h1 class="indent">La Cantoche <span class="marker">rose</span></h1>
      <p class="subtitle indent">Écoles <span id="school-name">primaires</span> de Toulouse, repas du midi</p>
      <nav class="week-nav" aria-label="Choix de la semaine">
        <div class="week-buttons">
          <button type="button" id="prev-week" class="icon-button" aria-label="Semaine précédente">‹</button>
          <button type="button" id="next-week" class="icon-button" aria-label="Semaine suivante">›</button>
        </div>
        <p id="week-label" class="week-label"></p>
        <button type="button" id="this-week" class="text-button" hidden>Revenir à cette semaine</button>
      </nav>
    </div>
  </header>

  <nav id="day-nav" class="day-nav" aria-label="Navigation entre les jours" hidden>
    <button type="button" id="prev-day" class="icon-button" aria-label="Jour précédent">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button type="button" id="next-day" class="icon-button" aria-label="Jour suivant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </nav>

  <main class="page sheet">
    <div class="status-row indent">
      <p id="status" role="status"></p>
      <button type="button" id="retry" class="text-button" hidden>Réessayer</button>
    </div>

    <div id="days"></div>

    <footer class="indent">
      La Cantoche rose affiche le menu de la cantine des écoles maternelles et primaires de Toulouse, jour par jour.
      Source&nbsp;: <a href="https://data.toulouse-metropole.fr/explore/dataset/menus/">open data Toulouse Métropole</a>
    </footer>
  </main>
</body>
</html>
